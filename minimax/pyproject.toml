[project]
name = "minimax-sdd-context"
version = "0.2.0"
description = "SDD context module for the MiniMax x OceanBase track"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "powercontext[server]==1.2.0",
  "alembic>=1.16,<2",
  "pylibseekdb==1.4.0.post2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "demo_app/tests"]
