services:
  api:
    volumes:
      - dify-storage:/app/api/storage
  worker:
    volumes:
      - dify-storage:/app/api/storage
  db:
    volumes:
      - dify-db:/var/lib/postgresql/data
  redis:
    volumes:
      - dify-redis:/data
  sandbox:
    volumes:
      - dify-sandbox:/dependencies
  weaviate:
    volumes:
      - dify-weaviate:/var/lib/weaviate
  nginx:
    image: nginx:stable
  powercontext:
    build:
      context: ${LOSTFOUND_ROOT:?Run scripts/compose.sh}/deploy/powercontext
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    environment:
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
    volumes:
      - powercontext-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health/ready',timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
  memory-bridge:
    build:
      context: ${LOSTFOUND_ROOT:?Run scripts/compose.sh}/backend
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    environment:
      PC_BASE_URL: http://powercontext:18080
      PC_SCOPE_FILE: /data/scope.json
      BUREAU_SERVICE_TOKEN: ${BUREAU_SERVICE_TOKEN:?Run scripts/init_env.py}
      BUREAU_NAMESPACE: ${BUREAU_NAMESPACE:-lostfound-v3}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    volumes:
      - bridge-data:/data
    depends_on:
      powercontext:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-19080}:19080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19080/health',timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 10s
volumes:
  dify-storage:
  dify-db:
  dify-redis:
  dify-sandbox:
  dify-weaviate:
  powercontext-data:
  bridge-data:
